name: check

"on":
  push:
    branches: [main]
  pull_request:
  # A push runs only the jobs its paths touch. The weekly run checks
  # everything on main and keeps main's caches warm for pull requests.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether each job has anything to prove. Path filters at the
  # workflow level would leave skipped required checks pending, so the
  # decision is made here and the jobs are skipped with `if:`, which reports
  # them as skipped, which a required check accepts. A pull request is diffed
  # against its base and a push against the commit it moved main from; with
  # no base to diff against, everything runs.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      windows: ${{ steps.filter.outputs.windows }}
      web: ${{ steps.filter.outputs.web }}
      plugins: ${{ steps.filter.outputs.plugins }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            for job in rust windows web plugins android; do
              echo "$job=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          # Inputs of the Rust build and tests, including what the binary
          # embeds (web/, skills/) and what tests read from the tree.
          git diff --name-only "$BASE_SHA" HEAD | tee "$RUNNER_TEMP/changed"
          if grep -qE '^(src/|tests/|web/|skills/|plugins/|Cargo\.toml$|Cargo\.lock$|build\.rs$|Makefile$|AGENTS\.md$|DESIGN\.md$|docs/log\.md$|docs/reference/knowledge-base-pages\.md$|\.github/workflows/check\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          # The Windows subset runs the lib tests and five test binaries, none
          # of which read the tree. The lib embeds web/, skills/ and
          # plugins/antigravity/ at compile time, so those stay on the list.
          if grep -qE '^(src/|tests/|web/|skills/|plugins/antigravity/|Cargo\.toml$|Cargo\.lock$|build\.rs$|\.github/workflows/check\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi
          # web/crypto, web/units and web/styles read web/, the vitest tests
          # and their fixtures, and the Node toolchain.
          if grep -qE '^(web/|\.agents/js-tests/|tests/fixtures/frontmatter/|vitest\.config\.mjs$|package\.json$|package-lock\.json$|Makefile$|\.github/workflows/check\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          # plugins/check tests the plugins, diffs skills/agent-hub against
          # the Claude plugin's copy, and reads the version in Cargo.toml and
          # the marketplace in .claude-plugin/.
          if grep -qE '^(plugins/|skills/agent-hub/|\.claude-plugin/|Cargo\.toml$|package\.json$|package-lock\.json$|Makefile$|\.github/workflows/check\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          fi
          # The Android app builds and tests from android/ alone; the Makefile
          # holds its targets.
          if grep -qE '^(android/|Makefile$|\.github/workflows/check\.yml$|\.github/actions/android-setup/|\.github/workflows/android-release\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
  lint:
    name: Lint and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.97.1
          components: rustfmt
          build-warnings: ""
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      # `make lint` runs the hooks, which include `okf validate`.
      - name: Install okf and pre-commit
        run: |
          GOBIN="$RUNNER_TEMP/bin" GOTOOLCHAIN=auto \
            go install github.com/okfcli/okf/cmd/okf@latest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip pre-commit==4.6.2
      - run: make lint lint/engine fmt/check

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: make web/crypto web/units web/styles

  plugins:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    name: Plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: make plugins/check

  # The Android app's unit tests, lint and the release build, so R8 and the
  # release lint fail here rather than on a release. No secrets and no
  # signing: the release workflow signs the APK.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: ./.github/actions/android-setup
      # Robolectric fetches the Android framework jars it runs against on first use.
      - uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - run: make android/test android/lint android/apk VERSION=0.0.1

  checks:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.97.1
          components: clippy
          build-warnings: ""
      - run: make clippy net/check serve/check

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Test ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.97.1
          build-warnings: ""
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest
      - run: make test/shard N=${{ matrix.shard }} M=2

  install:
    name: Install script harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make install/test

  # Windows is gated: this job reports but does not fail the run, until the
  # subset has proven stable on the runner. It runs the config tests, the
  # process and service operations and one HTTP smoke test.
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: Windows subset ${{ matrix.shard }}/2
    runs-on: windows-2025
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.97.1
          build-warnings: ""
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest
      - run: cargo nextest run --locked --lib --test hub_config --test cli_help --test daemon_ops --test ops_lifecycle --test http_storage --partition count:${{ matrix.shard }}/2
