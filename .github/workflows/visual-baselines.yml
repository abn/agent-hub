name: visual-baselines

# The `toHaveScreenshot` baselines are written here, on the runner, browser
# build and fonts the e2e job compares against, since a baseline taken anywhere
# else never matches. Dispatch it on a branch: it runs both e2e shards in turn,
# rewriting the baselines that changed, and pushes them to that branch as one
# commit.
#
# The job that builds and runs the tests holds a read-only token. Only the
# second job, which runs no repository code, may push, and it pushes only the
# PNG files the first job handed it.
#
# A push made with GITHUB_TOKEN does not start another workflow, so that commit
# runs no CI. The branch's author fetches it, folds it into their own commit
# and force-pushes, and that push runs CI against the new baselines.

"on":
  workflow_dispatch:

permissions:
  contents: read

# Two runs on one branch would race to push onto it.
concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baselines:
    name: Refresh visual baselines
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    env:
      HUB_REQUIRE_BROWSER: "1"
    steps:
      - name: Refuse the default branch
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "::error::dispatch this on a feature branch, not on $REF_TYPE $REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.97.1
          build-warnings: ""
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci --no-audit --no-fund
      # The design's font stack resolves to Cantarell on Linux; without it the
      # 300px geometry checks overflow.
      - run: sudo apt-get update && sudo apt-get install -y fonts-cantarell
      - run: npx playwright install --with-deps chromium
      - run: make e2e/baselines
      - name: Collect changed baselines
        id: collect
        run: |
          mkdir -p target/tmp
          git ls-files -z -mo --exclude-standard -- 'e2e/*-snapshots/*.png' > target/tmp/baselines.list
          if [ -s target/tmp/baselines.list ]; then
            tar --null -T target/tmp/baselines.list -cf target/tmp/baselines.tar
            tar -tvf target/tmp/baselines.tar
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo "The baselines are current."
            echo changed=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.collect.outputs.changed == 'true'
        with:
          name: baselines
          path: target/tmp/baselines.tar
          retention-days: 1
          if-no-files-found: ignore

  push:
    name: Push visual baselines
    needs: baselines
    if: needs.baselines.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes the baselines commit to the dispatched branch
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baselines
          path: ${{ runner.temp }}/baselines
      - name: Commit and push the baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          BASE_SHA: ${{ github.sha }}
        run: |
          archive="$RUNNER_TEMP/baselines/baselines.tar"
          if tar -tf "$archive" | grep -Ev '^e2e/[^/]+-snapshots/[^/]+\.png$'; then
            echo "::error::the baselines archive holds a path that is not a baseline"
            exit 1
          fi
          tar -xf "$archive"
          tar -tf "$archive" | xargs -d '\n' git add --
          git diff --cached --stat
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 "$remote" "refs/heads/${REF_NAME}"
          if [ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
            echo "::error::${REF_NAME} moved since this run started; pull it and run the workflow again"
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'test(e2e): refresh visual baselines'
          git push "$remote" "HEAD:refs/heads/${REF_NAME}"
