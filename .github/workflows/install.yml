name: install

# The install scripts and the service lifecycle, end to end on the three
# operating systems, each against a local release made from the binary this
# change builds. Nothing here reaches the real release or a real hub.
#
# Linux runs the real install.sh in a rootless podman container with systemd as
# PID 1. Root in that container, never the runner's, creates a user and turns
# linger on; the user then installs and drives a real systemd user service. That
# needs no sudo on the host and does not depend on how the runner starts its own
# user manager. macOS uses a real LaunchAgent in the runner's own login. Windows
# uses a real Task Scheduler task and is gated: a Windows failure is reported but
# does not fail the run.

"on":
  pull_request:
    paths:
      - deploy/install.sh
      - deploy/install.ps1
      - tests/install/**
      - src/service/**
      - src/daemon/**
      - src/config.rs
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - .github/workflows/install.yml
      - .github/workflows/binaries-windows.yml
  push:
    branches: [main]
    paths:
      - deploy/install.sh
      - deploy/install.ps1
      - tests/install/**
      - src/service/**
      - src/daemon/**
      - src/config.rs
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - .github/workflows/install.yml
      - .github/workflows/binaries-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script lint and harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Warnings and errors only: the `A && B || C` chains in the e2e scripts
      # are deliberate, and the pre-commit hook holds install.sh to the full set.
      - name: Shellcheck
        run: |
          shellcheck --severity=warning deploy/install.sh tests/install/run.sh tests/install/e2e/*.sh

      - name: Harness against a stub binary
        run: make install/test

      # An error fails the job. A warning is annotated, so a new rule in a
      # newer analyzer cannot block a release by itself.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $files = 'deploy/install.ps1', 'tests/install/e2e/windows.ps1'
          $found = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error, Warning }
          foreach ($f in $found) {
            $level = if ($f.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Host "::$level file=$($f.ScriptName),line=$($f.Line)::$($f.RuleName): $($f.Message)"
          }
          if ($found | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }

  linux:
    name: Linux, systemd user service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.97.1
          build-warnings: ""
      - run: cargo build --release --locked
      - run: make install/e2e

  macos:
    name: macOS, LaunchAgent
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.97.1
          build-warnings: ""
      - run: cargo build --release --locked
      - run: sh tests/install/e2e/macos.sh target/release/agent-hub

  windows:
    name: Windows, scheduled task (gated)
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.97.1
          build-warnings: ""
      - run: cargo build --release --locked
      - name: Install, run and remove the service
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install/e2e/windows.ps1 -Bin target\release\agent-hub.exe
