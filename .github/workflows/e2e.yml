name: e2e

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Decides whether the browser run has anything to prove. The decision is
  # made here and the shards are skipped with `if:`, because a workflow-level
  # `paths:` filter would leave skipped required checks pending. Pushes to
  # main run everything.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Inputs of the browser run: the binary it builds and what that
          # binary embeds (src/, web/, skills/, plugins/antigravity/), the
          # specs, config and seeded-hub harness, and the Node toolchain.
          git diff --name-only "$BASE_SHA" HEAD | tee "$RUNNER_TEMP/changed"
          if grep -qE '^(src/|web/|skills/|plugins/antigravity/|e2e/|\.agents/skills/seeded-hub/|playwright\.config\.mjs$|package\.json$|package-lock\.json$|Cargo\.toml$|Cargo\.lock$|build\.rs$|Makefile$|\.github/workflows/e2e\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Browser ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      HUB_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.97.1
          build-warnings: ""
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci --no-audit --no-fund
      # The design's font stack resolves to Cantarell on Linux; without it the
      # 300px geometry checks overflow.
      - run: sudo apt-get update && sudo apt-get install -y fonts-cantarell
      - run: npx playwright install --with-deps chromium
      - run: make e2e/shard SHARD=${{ matrix.shard }}/2
