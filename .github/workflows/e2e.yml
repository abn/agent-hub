name: e2e

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Browser checks
    runs-on: ubuntu-24.04
    env:
      HUB_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: 1.97.1

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The design's font stack resolves to Cantarell on Linux; without it the
      # runner falls back to a wider face and the 300px geometry checks overflow.
      - name: Install the design font
        run: sudo apt-get update && sudo apt-get install -y fonts-cantarell

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the browser checks
        run: make e2e
