name: release

# release-please owns the version, CHANGELOG.md, the tag and the GitHub release.
# When it cuts one, this same run builds and pushes the image with buildah and
# podman, then verifies it. The image is built here rather than on the tag,
# because a tag created with the default GITHUB_TOKEN does not trigger another
# workflow.
"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize releases per branch instead of cancelling: a release PR update and
# a tag have to finish rather than race each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The config and manifest files are read from the checkout.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Build, push and verify
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The Version row shows a short commit, so the build is given the short
      # form of the tagged commit rather than the full sha.
      - name: Resolve the version and commit
        id: meta
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          test -n "$VERSION" || { printf 'no version from release-please\n' >&2; exit 1; }
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1.7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The local build tags and the pushed tags must align, so push-to-registry
      # reuses the tags buildah-build reports rather than recomputing them. The
      # image name is the repository path, ghcr.io/<repo> after the push.
      - name: Build the image
        id: build
        uses: redhat-actions/buildah-build@b13805753a7ac93d18d14b22f6ebdf8499a3a95e # v2.9
        with:
          image: ${{ github.repository }}
          tags: ${{ steps.meta.outputs.version }} latest
          containerfiles: Containerfile
          # The image context has no .git, so the build script is told which
          # commit it is building.
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}

      - name: Push the image
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing is released until the published image answers. The runtime is
      # distroless, so the probe is the binary's own health subcommand.
      - name: Verify the pushed image serves
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          image="ghcr.io/${{ github.repository }}:$VERSION"
          token="verify-$(date +%s)"
          name="release-verify-$$"
          podman run --detach --name "$name" \
            --publish 127.0.0.1:18080:8080 \
            --env HUB_ADMIN_TOKEN="$token" \
            --volume "$name-data:/data" \
            "$image"
          ready=""
          for attempt in $(seq 30); do
            if podman exec "$name" /usr/local/bin/agent-hub health --url http://127.0.0.1:8080; then
              ready=yes
              break
            fi
            sleep 1
          done
          test "$ready" = yes
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:18080/bootstrap/SKILL.md > /dev/null
          payload=$(curl -fsS -H "Authorization: Bearer $token" \
            http://127.0.0.1:18080/api/v1/storage)
          printf '%s\n' "$payload" | grep -q "\"version\":\"$VERSION\""
          printf '%s\n' "$payload" | grep -q "\"commit\":\"$COMMIT\""
          podman rm --force --volumes "$name"
