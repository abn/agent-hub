name: release

# A tag created with the default GITHUB_TOKEN does not trigger another workflow,
# so the image and the binaries are built in this same run.
"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: Binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # The Windows archive is built, proven and published on its own. Nothing
  # waits on it: the release smoke below needs the Unix archives only.
  binaries-windows:
    name: Windows binary
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/binaries-windows.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # The signed Android APK. Nothing waits on it: signing needs an approval in
  # the release-signing environment and is off until ANDROID_SIGNING is true.
  android:
    name: Android APK
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/android-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # A pinned copy of each script ships with every release, beside the copy the
  # site serves, so an install of an old version can use the script it shipped
  # with.
  installers:
    name: Install scripts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Attach the scripts and their checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p target/installers
          cp deploy/install.sh deploy/install.ps1 target/installers/
          cd target/installers
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
          gh release upload "$TAG" install.sh install.sh.sha256 install.ps1 install.ps1.sha256 \
            --clobber --repo "${{ github.repository }}"

  # Nothing is announced as installable until the published script installs the
  # published binary and the attestation checks out. The Windows archive is
  # gated, published by its own job, and not part of this.
  smoke:
    name: Install the published release
    needs: [release-please, binaries, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Fetch the published script and check it against its checksum
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          curl -fsSL -o install.sh "$base/install.sh"
          curl -fsSL -o install.sh.sha256 "$base/install.sh.sha256"
          sha256sum --check install.sh.sha256

      - name: Install without a service, with provenance required
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          smoke=$PWD/target/tmp/smoke
          mkdir -p "$smoke/bin" "$smoke/cache" "$smoke/state"
          XDG_CACHE_HOME=$smoke/cache XDG_STATE_HOME=$smoke/state \
            sh install.sh --version "v$VERSION" --no-service --require-provenance --bin-dir "$smoke/bin"
          "$smoke/bin/agent-hub" --version | grep -F "agent-hub $VERSION"

  image:
    name: Build, push and verify
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve the version and commit
        id: meta
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          test -n "$VERSION" || { printf 'no version from release-please\n' >&2; exit 1; }
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1.7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        id: build
        uses: redhat-actions/buildah-build@b13805753a7ac93d18d14b22f6ebdf8499a3a95e # v2.9
        with:
          image: ${{ github.repository }}
          tags: ${{ steps.meta.outputs.version }} latest
          containerfiles: Containerfile
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}

      - name: Push the image
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing is released until the published image answers. The runtime is
      # distroless, so the probe is the binary's own health subcommand.
      - name: Verify the pushed image serves
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          image="ghcr.io/${{ github.repository }}:$VERSION"
          token="verify-$(date +%s)"
          name="release-verify-$$"
          podman run --detach --name "$name" \
            --publish 127.0.0.1:18080:8080 \
            --env HUB_ADMIN_TOKEN="$token" \
            --volume "$name-data:/data" \
            "$image"
          ready=""
          for attempt in $(seq 30); do
            if podman exec "$name" /usr/local/bin/agent-hub health --url http://127.0.0.1:8080; then
              ready=yes
              break
            fi
            sleep 1
          done
          test "$ready" = yes
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:18080/bootstrap/SKILL.md > /dev/null
          payload=$(curl -fsS -H "Authorization: Bearer $token" \
            http://127.0.0.1:18080/api/v1/storage)
          printf '%s\n' "$payload" | grep -q "\"version\":\"$VERSION\""
          printf '%s\n' "$payload" | grep -q "\"commit\":\"$COMMIT\""
          podman rm --force --volumes "$name"

  antigravity:
    name: Antigravity plugin archive
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the archive
        run: make plugins/antigravity-dist

      - name: Attach the archive and its checksum to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          cd target/dist
          archive="agent-hub-antigravity-$VERSION.tar.gz"
          test -f "$archive"
          sha256sum "$archive" > "agent-hub-antigravity-$VERSION.sha256"
          gh release upload "$TAG" "$archive" "agent-hub-antigravity-$VERSION.sha256" \
            --clobber --repo "${{ github.repository }}"

  # Publishes only when the owner has opted in: an NPM_TOKEN secret, or the
  # PUBLISH_NPM repository variable set to true for npm trusted publishing.
  opencode:
    name: Publish the OpenCode plugin
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
    steps:
      - id: gate
        run: |
          if [ -n "$NPM_TOKEN" ] || [ "$PUBLISH_NPM" = true ]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'npm publishing is not configured, skipping\n'
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish with provenance
        if: steps.gate.outputs.enabled == 'true'
        working-directory: plugins/opencode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          npm publish --access public --provenance
