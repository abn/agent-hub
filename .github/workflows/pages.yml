name: Publish wiki

# Pages must be enabled once (Settings, Pages, Source: GitHub Actions) or the
# deploy fails with a 404.
"on":
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Render and deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.deploy-url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned to a commit, not a moving tag: the wiki has no tagged release.
      - id: deploy
        uses: abn/okf-wiki/action@052f3d746f1fc96aa218a460fe41572f136a2140 # main
        with:
          content: docs
          deploy: true
          brand: agent-hub
          brand-sub: docs
          title: Agent Hub Docs
          sections: "design:Design,architecture:Architecture,usage:Usage,contribution:Contribution,adr:Decisions"
          nav-links: "abn.is=https://abn.is,GitHub=https://github.com/${{ github.repository }}"
