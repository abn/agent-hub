name: container

# Only the paths the image is built from: a docs or CI-only push must not spend
# fifteen minutes compiling the engine.
"on":
  push:
    branches: [main]
    paths:
      - Containerfile
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - "vendor/**"
      - "src/**"
      - "web/**"
      - "skills/**"
      - "deploy/**"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - Containerfile
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - "vendor/**"
      - "src/**"
      - "web/**"
      - "skills/**"
      - "deploy/**"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Container
    runs-on: ubuntu-24.04
    env:
      HUB_ADMIN_TOKEN: placeholder-for-config-rendering
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate the compose file
        run: make container/config
      - name: Build the image
        run: podman build -f Containerfile -t ghcr.io/abn/agent-hub:ci .
