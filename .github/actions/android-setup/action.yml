name: Android setup
description: >-
  The JDK, Gradle, the Android platform and the Tendril binding the app builds
  against. The binding is cached on the ref the app pins, and the NDK, CMake and
  Rust it builds with are installed only when that cache misses.

runs:
  using: composite
  steps:
    # android/scripts/gradle.sh caps Gradle with systemd-run when it finds one; a runner has no user bus.
    - shell: bash
      run: echo "AGENT_HUB_UNCAPPED=1" >> "$GITHUB_ENV"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: "21"
    - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
    # The one place the pin lives is the script that builds from it.
    - id: tendril
      shell: bash
      run: echo "ref=$(grep -m1 -oE 'TENDRIL_REF:-[0-9a-f]+' android/scripts/tendril-aar.sh | cut -d- -f2)" >> "$GITHUB_OUTPUT"
    - id: aar
      uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
      with:
        path: android/build/tendril
        key: tendril-aar-${{ steps.tendril.outputs.ref }}-${{ hashFiles('android/scripts/tendril-aar.sh') }}
    # The platform the app compiles against. Licences are accepted by the action.
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      with:
        packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
    - if: steps.aar.outputs.cache-hit != 'true'
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      with:
        packages: "ndk;27.1.12297006 cmake;3.22.1"
    - if: steps.aar.outputs.cache-hit != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      with:
        toolchain: 1.97.1
        target: aarch64-linux-android
        cache: false
        build-warnings: ""
    - if: steps.aar.outputs.cache-hit != 'true'
      shell: bash
      env:
        TENDRIL_REF: ${{ steps.tendril.outputs.ref }}
      run: |
        git clone https://github.com/agync/tendril "$RUNNER_TEMP/tendril"
        make android/tendril TENDRIL_DIR="$RUNNER_TEMP/tendril" TENDRIL_REF="$TENDRIL_REF"
