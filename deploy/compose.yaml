services:
  hub:
    build:
      context: ..
      dockerfile: Containerfile
    environment:
      HUB_DATA_DIR: /data
      HUB_BIND: 0.0.0.0:8080
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:?set HUB_ADMIN_TOKEN in the environment or a .env file}
    ports:
      - "8080:8080"
    volumes:
      - hub-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  hub-data:
