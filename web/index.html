<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F5F3EE">
  <title>Agent Hub</title>
  <script>
    // Every reference below is relative to the document, not the origin
    // root, so it survives being served under a path prefix by a proxy that
    // strips the prefix before forwarding. Relative URLs resolve against
    // the document's own URL, not its directory, so a URL that does not end
    // in "/" collapses a relative reference to its parent instead of itself.
    // This is a hash-router app: every real path is the app root, so a path
    // not ending in "/" always means "add one and reload", never "a page
    // one level down". Runs before anything below fetches, and only once:
    // the redirect target already ends in "/", so it never loops.
    if (!location.pathname.endsWith("/")) {
      location.replace(location.pathname + "/" + location.search + location.hash);
    }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <nav class="rail" aria-label="Primary">
      <div class="rail-brand-group">
        <div class="rail-title">Agent Hub</div>
        <div class="rail-node mono" id="top-node"></div>
      </div>
      <div class="rail-nav">
        <a class="rail-item" href="#/home" data-route="home">
          <svg class="rail-glyph" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 11 12 4l8 7v9H4z M 10 20v-6h4v6"></path></svg>
          <span class="rail-label">Home</span>
        </a>
        <a class="rail-item" href="#/inbox" data-route="inbox">
          <svg class="rail-glyph" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 13h4l2 3h4l2-3h4 M 5 5h14l1 8v6H4v-6z"></path></svg>
          <span class="rail-label">Inbox</span>
          <span class="badge rail-badge" id="top-badge" hidden></span>
        </a>
        <a class="rail-item" href="#/search" data-route="search">
          <svg class="rail-glyph" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M 16 16l4 4"></path></svg>
          <span class="rail-label">Search</span>
          <span class="rail-key mono" aria-hidden="true">/</span>
        </a>
      </div>
      <div class="rail-section-header">PROJECTS</div>
      <div class="rail-projects" id="rail-projects"></div>
      <div class="rail-spacer"></div>
      <div class="rail-foot">
        <a class="rail-item" href="#/storage" data-route="storage">
          <svg class="rail-glyph" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 7c0-1.6 3.6-3 8-3s8 1.4 8 3-3.6 3-8 3-8-1.4-8-3z M 4 7v10c0 1.6 3.6 3 8 3s8-1.4 8-3V7"></path></svg>
          <span class="rail-label">Storage</span>
        </a>
        <a class="rail-item" href="#/settings" data-route="settings">
          <svg class="rail-glyph" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M 12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"></path></svg>
          <span class="rail-label">Settings</span>
        </a>
        <div class="rail-sync mono" id="rail-sync">synced just now</div>
      </div>
    </nav>
    <main id="main" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Primary">
      <a class="tab" href="#/home">
        <span class="tab-icon"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 11 12 4l8 7v9H4z M 10 20v-6h4v6"></path></svg></span>
        <span class="tab-label">Home</span>
      </a>
      <a class="tab" href="#/inbox">
        <span class="tab-icon"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 13h4l2 3h4l2-3h4 M 5 5h14l1 8v6H4v-6z"></path></svg><span class="badge" id="tab-badge" hidden></span></span>
        <span class="tab-label">Inbox</span>
      </a>
      <a class="tab" href="#/projects">
        <span class="tab-icon"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 7h6l2 2h8v10H4z"></path></svg></span>
        <span class="tab-label">Projects</span>
      </a>
      <a class="tab" href="#/search">
        <span class="tab-icon"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M 16 16l4 4"></path></svg></span>
        <span class="tab-label">Search</span>
      </a>
      <a class="tab" href="#/more">
        <span class="tab-icon"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
        <span class="tab-label">More</span>
      </a>
    </nav>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
