<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F5F3EE">
  <title>Agent Hub</title>
  <script>
    // Every reference below is relative to the document, not the origin
    // root, so it survives being served under a path prefix by a proxy that
    // strips the prefix before forwarding. Relative URLs resolve against
    // the document's own URL, not its directory, so a URL that does not end
    // in "/" collapses a relative reference to its parent instead of itself.
    // This is a hash-router app: every real path is the app root, so a path
    // not ending in "/" always means "add one and reload", never "a page
    // one level down". Runs before anything below fetches, and only once:
    // the redirect target already ends in "/", so it never loops.
    if (!location.pathname.endsWith("/")) {
      location.replace(location.pathname + "/" + location.search + location.hash);
    }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header class="topbar">
      <span class="wordmark">Agent Hub</span>
      <nav aria-label="Primary">
        <a href="#/home">Home</a>
        <a href="#/inbox">Inbox <span class="badge" id="top-badge" hidden></span></a>
        <a href="#/projects">Projects</a>
      </nav>
      <form class="topsearch" data-action="search" role="search">
        <label class="sr-only" for="top-search">Search</label>
        <svg class="topsearch-glyph" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M 16 16l4 4"></path></svg>
        <input id="top-search" name="q" type="search" placeholder="Search" autocomplete="off">
        <span class="topsearch-hint" aria-hidden="true">/</span>
      </form>
      <span class="topnode mono" id="top-node"></span>
      <a class="topgear" href="#/settings" aria-label="Settings">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M 19 12a7 7 0 0 0-.2-1.6l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.8-1.6L13.3 2h-2.6l-.4 2.9a7 7 0 0 0-2.8 1.6l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .5.1 1.1.2 1.6l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.8 1.6l.4 2.9h2.6l.4-2.9a7 7 0 0 0 2.8-1.6l2.3 1 2-3.4-2-1.5c.1-.5.2-1.1.2-1.6z"></path></svg>
      </a>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Primary">
      <a class="tab" href="#/home">
        <span class="tab-icon"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 11 12 4l8 7v9H4z M 10 20v-6h4v6"></path></svg></span>
        <span class="tab-label">Home</span>
      </a>
      <a class="tab" href="#/inbox">
        <span class="tab-icon"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 13h4l2 3h4l2-3h4 M 5 5h14l1 8v6H4v-6z"></path></svg><span class="badge" id="tab-badge" hidden></span></span>
        <span class="tab-label">Inbox</span>
      </a>
      <a class="tab" href="#/projects">
        <span class="tab-icon"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 4 7h6l2 2h8v10H4z"></path></svg></span>
        <span class="tab-label">Projects</span>
      </a>
      <a class="tab" href="#/search">
        <span class="tab-icon"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M 16 16l4 4"></path></svg></span>
        <span class="tab-label">Search</span>
      </a>
    </nav>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
