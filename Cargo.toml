[package]
name = "agent-hub"
version = "1.20.0"
edition = "2024"
license = "MIT"
description = "A local-first operations layer for AI agents and their humans."
publish = false

[dependencies]
# One engine everywhere, pinned exactly. See vendor/agentfs-sdk/PATCHES.md.
turso = "=0.8.0-pre.11"
agentfs-sdk = { path = "vendor/agentfs-sdk" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Already in the build through toml, at the version the lock file pins; taken
# directly so service install adds keys to config.toml without disturbing its
# comments or layout.
toml_edit = "0.22.27"
url = "2"
# Already in the build through url; taken directly to encode and decode the
# page path segments of a knowledge base resource URI.
percent-encoding = "2.3"
thiserror = "2"
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.4", features = ["transport-io", "transport-streamable-http-server"] }
ulid = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
rand = "0.9"
sha2 = "0.10"
# The embedded tailnet endpoint is compiled in by default and stays opt-in at
# runtime: setting HUB_TAILNET is what joins the tailnet. It is experimental:
# the library has no tailnet name resolution or certificate issuance and its
# NAT traversal is in progress.
tailscale = { version = "0.5", features = ["axum"], optional = true }
# The contentless notify nudge is an HTTP POST from the serve-only build. These
# crates are already in that build through the engine's own client, at the
# versions the lock file pins, so taking them directly adds no crate to the
# container. rustls only, with the same aws-lc-rs provider: no OpenSSL.
# A phone's requests are HTTP/2 over its Tendril session, served by the same
# router as the HTTP listener, hence the server and http2 features.
hyper = { version = "1", default-features = false, features = ["client", "http1", "server", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "server", "service", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "native-tokio", "tls12"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
# Already in the build through the tailnet's own dependencies, at the version
# the lock file pins; taken directly for the client's knowledge base export,
# which refuses page paths a case-insensitive, normalising filesystem would
# keep as one file.
unicode-normalization = { version = "0.1.25", optional = true }

# The pairing URI drawn as a QR code for Settings > Phones. No image
# features: the web app draws the modules itself.
qrcode = { version = "0.14", default-features = false }
# Already in the build through Tendril; taken directly to wipe the wake
# configuration's secrets once read.
zeroize = "1"

[features]
default = ["client", "tailnet", "phones"]
# The client side: the stdio proxy and the one-shot calls. Default on, so a
# published binary proxies out of the box; the container, which only serves,
# builds without it. rmcp's reqwest transport is taken whole rather than
# implementing its client trait here, and it is rustls only: an OpenSSL
# linkage would break the distroless image.
client = [
  "dep:reqwest",
  "dep:unicode-normalization",
  "rmcp/client",
  "rmcp/reqwest",
  "rmcp/transport-streamable-http-client-reqwest",
]
tailnet = ["dep:tailscale"]
# The embedded Tendril host phones pair with and connect through, with its
# public relay route. Default on, and in the container; a build without it,
# and any Windows build for now, answers Add a phone with "unavailable".
phones = ["dep:tendril-core", "dep:tendril-runtime"]

# Already in the build as a transitive dependency; taken directly, at the
# version the lock file already pins, for the volume and host name the storage
# screen reports, and the signals that stop a hub. Safe API only.
[target.'cfg(unix)'.dependencies]
# Phones reach the hub through Tendril: its pairing, device keys, revocation
# and transport, used as they ship. Pinned to a main revision until the
# v0.2.0 tag (docs/adr/0041-phones-pair-and-connect-through-tendril.md). Unix
# only until then: that revision does not build on Windows.
tendril-core = { git = "https://github.com/agync/tendril", rev = "68c215b46ab993e94b25303c6c8bf5b7158c2457", optional = true }
tendril-runtime = { git = "https://github.com/agync/tendril", rev = "68c215b46ab993e94b25303c6c8bf5b7158c2457", features = ["auto-advertise", "p2p-iroh"], optional = true }
rustix = { version = "1.1.4", features = ["fs", "process", "system"] }

# The volume's free space, the path a transcript handle names, a lock file's
# identity and a process's start time, the named event that stops a hub, an
# elevation check, and the user PATH, which the standard library does not
# expose on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# A phone for the browser checks: pairs with a hub the way the app does.
[[example]]
name = "tendril-phone"
required-features = ["phones"]
