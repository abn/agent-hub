[package]
name = "agent-hub"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A local-first operations layer for AI agents and their humans."
publish = false

[dependencies]
# One engine everywhere, pinned exactly. See vendor/agentfs-sdk/PATCHES.md.
turso = "=0.8.0-pre.11"
agentfs-sdk = { path = "vendor/agentfs-sdk" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
thiserror = "2"
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.4", features = ["transport-io", "transport-streamable-http-server"] }
ulid = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
rand = "0.9"
sha2 = "0.10"
# The embedded tailnet endpoint is compiled in by default and stays opt-in at
# runtime: setting HUB_TAILNET is what joins the tailnet. It is experimental:
# the library has no tailnet name resolution or certificate issuance and its
# NAT traversal is in progress.
tailscale = { version = "0.5", features = ["axum"], optional = true }
# Already in the build as a transitive dependency; taken directly, at the
# version the lock file already pins, for the volume and host name the storage
# screen reports. Safe API only.
rustix = { version = "1.1.4", features = ["fs", "system"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }

[features]
default = ["client", "tailnet"]
# The client side: the stdio proxy and the one-shot calls. Default on, so a
# published binary proxies out of the box; the container, which only serves,
# builds without it. rmcp's reqwest transport is taken whole rather than
# implementing its client trait here, and it is rustls only: an OpenSSL
# linkage would break the distroless image.
client = [
  "dep:reqwest",
  "rmcp/client",
  "rmcp/reqwest",
  "rmcp/transport-streamable-http-client-reqwest",
]
tailnet = ["dep:tailscale"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
