[package]
name = "agent-hub"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "A local-first operations layer for AI agents and their humans."
publish = false

[dependencies]
# One engine everywhere, pinned exactly. See vendor/agentfs-sdk/PATCHES.md.
turso = "=0.8.0-pre.11"
agentfs-sdk = { path = "vendor/agentfs-sdk" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.4", features = ["transport-io", "transport-streamable-http-server"] }
ulid = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
