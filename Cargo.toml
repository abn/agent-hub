[package]
name = "agent-hub"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "A local-first operations layer for AI agents and their humans."
publish = false

[dependencies]
# One engine everywhere, pinned exactly. See vendor/agentfs-sdk/PATCHES.md.
turso = "=0.8.0-pre.11"
agentfs-sdk = { path = "vendor/agentfs-sdk" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.4", features = ["transport-io", "transport-streamable-http-server"] }
ulid = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
rand = "0.9"
sha2 = "0.10"
# The embedded tailnet endpoint is optional and off by default, so the standard
# binary and the one-engine gate are untouched. It is experimental: the library
# has no tailnet name resolution or certificate issuance and its NAT traversal
# is in progress.
tailscale = { version = "0.5", features = ["axum"], optional = true }

[features]
default = ["client"]
# The client side: the stdio proxy and the one-shot calls. Default on, so a
# published binary proxies out of the box; the container, which only serves,
# builds without it. rmcp's reqwest transport is taken whole rather than
# implementing its client trait here, and it is rustls only: an OpenSSL
# linkage would break the distroless image.
client = [
  "rmcp/client",
  "rmcp/reqwest",
  "rmcp/transport-streamable-http-client-reqwest",
]
tailnet = ["dep:tailscale"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
