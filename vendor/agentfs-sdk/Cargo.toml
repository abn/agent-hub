[package]
name = "agentfs-sdk"
version = "0.6.4"
edition = "2021"
description = "AgentFS SDK for Rust"
license = "MIT"
publish = false

[dependencies]
turso = { version = "=0.8.0-pre.11", features = ["sync"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
thiserror = "1.0"
lru = "0.12"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# `aegis`'s C/NEON backend fails to compile with Apple clang on arm64 due to
# missing SHA3/NEON intrinsics. The `pure-rust` feature skips its C build
# script on macOS.
aegis = { version = "0.9.6", features = ["pure-rust"] }
